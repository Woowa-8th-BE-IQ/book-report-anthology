# Render Blueprint. Render 대시보드 → New → Blueprint → 이 레포를 고르면 아래대로 만들어진다.
services:
  - type: web
    name: book-report-anthology
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Neon에서 받은 값을 Render가 물어볼 때 넣는다 (docs/deploy.md 참고)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
