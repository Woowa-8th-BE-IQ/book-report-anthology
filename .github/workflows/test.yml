name: test

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: 테스트
        run: ./gradlew test
      - name: 실패한 테스트를 주석으로 남기기
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("build/test-results/test/*.xml"):
              suite = ET.parse(path).getroot()
              for case in suite.iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      text = (problem.get("message") or "") + "\n" + (problem.text or "")
                      text = text.strip()[:1500].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          EOF
      - name: 테스트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: build/reports/tests/test
