name: desktop-pet

# 데스크톱 펫을 맥(dmg)·윈도우(exe)로 빌드해 GitHub 릴리스에 올린다.
# 서명·공증은 하지 않는다(설치 안내는 desktop/README.md).
on:
  push:
    branches: [main]
    paths: ['desktop/**', '!desktop/**/*.md', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 같은 버전은 다시 올리지 않는다(받는 중인 펫이 파일을 잃지 않게). 다시 내려면 버전을 올린다.
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          if gh release view "pet-v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::pet-v$VERSION 릴리스가 이미 있어서 건너뛴다"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: desktop/dist/*.zip
          - os: windows-latest
            target: --win
            files: desktop/dist/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: 설치 파일 만들기
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.target }} --publish never 2>&1 | tee build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder
      # 맥 앱은 바로가기(심볼릭 링크)와 서명을 보존해야 한다. electron-builder의 zip 대신 ditto로 묶는다.
      - name: 맥 앱 묶기 (ditto)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          for dir in dist/mac-arm64 dist/mac; do
            [ -d "$dir" ] || continue
            app=$(ls -d "$dir"/*.app)
            arch=$([ "$dir" = dist/mac-arm64 ] && echo arm64 || echo x64)
            codesign --verify --deep --strict --verbose=2 "$app"
            ditto -c -k --keepParent --sequesterRsrc "$app" "dist/book-report-pet-$VERSION-mac-$arch.zip"
            # 풀어서 다시 검증한다: 받은 사람이 보게 될 그대로
            rm -rf /tmp/check && mkdir /tmp/check && ditto -x -k "dist/book-report-pet-$VERSION-mac-$arch.zip" /tmp/check
            codesign --verify --deep --strict --verbose=2 /tmp/check/*.app
            test -L "/tmp/check/$(basename "$app")/Contents/Frameworks/Electron Framework.framework/Versions/Current"
          done
          ls -la dist/*.zip
      - name: 실패하면 로그 끝을 주석으로 남기기
        if: failure()
        shell: bash
        # 주석은 한 단계에 10개까지만 보이므로 오류다운 줄만 고른다
        run: |
          grep -iE '⨯|error|fail|cannot|exit code|hdiutil' build.log | grep -v '^\s*$' | tail -n 9 | cut -c1-900 | sed 's/^/::error::/'
          tail -n 1 build.log | sed 's/^/::error::last: /'
      - uses: actions/upload-artifact@v5
        with:
          name: pet-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - id: version
        run: echo "value=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pet-v${{ steps.version.outputs.value }}
          name: 덕후감 펫 ${{ steps.version.outputs.value }}
          make_latest: 'false'
          body: |
            모임방의 내 아바타를 바탕화면에 띄우는 데스크톱 펫이에요.
            - 맥: `…-mac-arm64.zip`(M1 이후) 또는 `…-mac-x64.zip`(인텔)
            - 윈도우: `…-win-x64.exe`
            설치와 첫 실행 방법은 desktop/README.md를 봐 주세요.
          files: out/*
          overwrite_files: true
