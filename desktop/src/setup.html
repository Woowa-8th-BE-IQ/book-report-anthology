<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
  <title>남의 독후감 펫</title>
  <style>
    body { margin: 0; padding: 26px 28px; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; background: #F6F1E9; color: #1A1208; }
    h1 { margin: 0 0 6px; font-size: 19px; }
    p { margin: 0 0 16px; font-size: 13px; line-height: 1.6; color: #4A3020; }
    ol { margin: 0 0 16px; padding-left: 18px; font-size: 12.5px; line-height: 1.7; color: #4A3020; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 13px; border: 1px solid #D8C9B4; border-radius: 10px; background: #FFFDF8; }
    input:focus { outline: 2px solid rgba(184,87,26,.35); }
    button { margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: #B8571A; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    .error { margin: 10px 0 0; font-size: 12px; color: #B8571A; min-height: 16px; }
  </style>
  <script src="setup.js" defer></script>
</head>
<body>
  <h1>내 아바타를 바탕화면에</h1>
  <p>모임방에 새 말이 오면 아바타가 말풍선으로 알려 줘요.</p>
  <ol>
    <li>문집 화면 아래 <b>내 개인 링크</b>를 복사해요.</li>
    <li>아래에 붙여 넣으면 끝이에요.</li>
  </ol>
  <form id="form">
    <input id="link" type="url" placeholder="https://…/me/…" autofocus required>
    <button type="submit">연결하기</button>
  </form>
  <p class="error" id="error"></p>
</body>
</html>
