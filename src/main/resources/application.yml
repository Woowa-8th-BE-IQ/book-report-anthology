spring:
  application:
    name: anthology
  datasource:
    url: jdbc:h2:file:./data/anthology;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: false
  web:
    resources:
      # css·js 주소에 내용 해시를 붙인다(/css/pet.css → /css/pet-3f2a….css). 바뀌면 주소가 바뀌어
      # 브라우저·펫이 예전 파일을 붙들고 있지 않는다.
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**

server:
  # three.js(700KB) 같은 큰 스크립트를 gzip으로 줄여 보낸다. 실시간 연결(text/event-stream)은 목록에 없어 그대로 흐른다.
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
  servlet:
    encoding:
      charset: UTF-8
      # 요청만 UTF-8로 강제한다. 응답까지 강제하면 EPUB 같은 바이너리에도 ;charset=UTF-8이 붙는다.
      # HTML 응답의 문자셋은 Thymeleaf가 붙인다.
      force-request: true
    # 세션(알림 문구를 한 번 넘기는 flash)은 쿠키로만 잇는다. 기본값이면 첫 이동 주소에 ;jsessionid=… 가 붙어
    # 주소창을 그대로 복사해 나누면 세션 값까지 함께 나간다.
    session:
      tracking-modes: cookie
  error:
    whitelabel:
      enabled: false

anthology:
  time-zone: Asia/Seoul
