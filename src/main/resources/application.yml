spring:
  application:
    name: anthology
  datasource:
    url: jdbc:h2:file:./data/anthology;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: false
  web:
    resources:
      # css·js 주소에 내용 해시를 붙인다(/css/pet.css → /css/pet-3f2a….css). 바뀌면 주소가 바뀌어
      # 브라우저·펫이 예전 파일을 붙들고 있지 않는다.
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**

server:
  servlet:
    encoding:
      charset: UTF-8
      # 요청만 UTF-8로 강제한다. 응답까지 강제하면 EPUB 같은 바이너리에도 ;charset=UTF-8이 붙는다.
      # HTML 응답의 문자셋은 Thymeleaf가 붙인다.
      force-request: true
  error:
    whitelabel:
      enabled: false

anthology:
  time-zone: Asia/Seoul
