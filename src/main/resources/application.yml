spring:
  application:
    name: anthology
  datasource:
    url: jdbc:h2:file:./data/anthology;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: false

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    whitelabel:
      enabled: false

anthology:
  time-zone: Asia/Seoul
