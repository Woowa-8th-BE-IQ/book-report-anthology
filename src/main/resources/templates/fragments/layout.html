<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#F6F1E9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16110C" media="(prefers-color-scheme: dark)">
  <!-- 첫 화면은 이름이 먼저, 나머지 화면은 화면 이름 · 덕후감 -->
  <title th:text="${title == null} ? '덕후감 | 책 덕후들의 독후감' : ${title} + ' · 덕후감'">덕후감 | 책 덕후들의 독후감</title>
  <meta name="description" th:content="${ogDescription} ?: '같은 책을 읽은 사람들의 독후감을 한 권으로. 내 글을 내면 남의 글이 열려요.'">
  <!-- 카톡·슬랙 공유 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="덕후감">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" th:content="${ogTitle} ?: (${title == null} ? '덕후감 | 책 덕후들의 독후감' : ${title} + ' · 덕후감')">
  <meta property="og:description" th:content="${ogDescription} ?: '같은 책을 읽은 사람들의 독후감을 한 권으로. 내 글을 내면 남의 글이 열려요.'">
  <meta property="og:image" th:content="${baseUrl != null} ? ${baseUrl} + '/img/og.png' : '/img/og.png'">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" th:href="@{/img/mark.svg}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sun-typeface/suit@2/fonts/variable/woff2/SUIT-Variable.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/app.js}" defer></script>
  <script th:src="@{/js/typing-sound.js}" defer></script>
</head>
<body>

<header class="site-header" th:fragment="header">
  <!-- 캐릭터 그림의 손그림 흔들림 필터. 숨겨진 그림보다 먼저 와야 한다(Avatar.WOBBLE) -->
  <svg class="wobble-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute" th:utext="${wobble}"></svg>
  <div class="wrap">
    <a class="brand" th:href="@{/}" aria-label="덕후감 처음으로">
      <span class="brand-mark" th:insert="~{fragments/layout :: mark}"></span>
      덕후감
    </a>
    <nav class="site-nav" aria-label="주요 메뉴">
      <a th:href="@{/#how}">하는 법</a>
      <a th:href="@{/#shelf}">책장</a>
      <a th:href="@{/#book}">책이 되면</a>
      <a th:href="@{/#faq}">자주 묻는 질문</a>
      <a th:href="@{/characters}">책 동물</a>
    </nav>
    <span class="spacer"></span>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="밤의 서재로 바꾸기" title="밤·낮 바꾸기">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.2A7.8 7.8 0 0 1 9.8 4.5a7.8 7.8 0 1 0 9.7 9.7z"/><path d="M16.2 4.2v2.6M14.9 5.5h2.6"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5L7 7M17 17l1.5 1.5M5.5 18.5L7 17M17 7l1.5-1.5"/></svg>
    </button>
    <a class="header-cta" th:href="@{/anthologies/new}">문집 열기</a>
  </div>
</header>

<!-- 로고: 책을 안은 뒤뚱(바위뛰기펭귄) -->
<svg th:fragment="mark" viewBox="0 0 40 40" aria-hidden="true"><rect x=".6" y=".6" width="38.8" height="38.8" rx="10.6" fill="#E9EDF3" stroke="#1A1208" stroke-width="1.2"/><clipPath id="mark-clip"><rect x="1.2" y="1.2" width="37.6" height="37.6" rx="10"/></clipPath><g clip-path="url(#mark-clip)"><svg x="0" y="1.5" width="40" height="40" viewBox="11 9.5 44 44" overflow="visible"><path d="M18 39c0-13 6.4-22.4 14-22.4S46 26 46 39c0 11.6-6.4 18-14 18s-14-6.4-14-18z" fill="#46536A" stroke="#2E241C" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/><path d="M23 41c0-6.4 4-10 9-10s9 3.6 9 10c0 8.8-4 13.6-9 13.6S23 49.8 23 41z" fill="#FFFDF8" stroke="#2E241C" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M23.4 31c0-3.6 3.8-5.4 8.6-5.4s8.6 1.8 8.6 5.4c0 2.8-3.8 4.2-8.6 4.2s-8.6-1.4-8.6-4.2z" fill="#FFFDF8" stroke="#2E241C" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M25.4 25.6l-6.6-3.6 4.2 3.6-5.4-.6 6.2 2.4M38.6 25.6l6.6-3.6-4.2 3.6 5.4-.6-6.2 2.4" fill="none" stroke="#F5C531" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 30.6l2-1.2 2 1.2-2 2.4z" fill="#FF9E3D" stroke="#2E241C" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><g transform="rotate(-6 32 47)"><rect x="22" y="41" width="20" height="12.6" rx="1.4" fill="#EE7A52" stroke="#2E241C" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round"/><path d="M22 44h20M22 50.8h20" stroke="#FFD9C2" stroke-width="1.3"/><path d="M40.6 42.4v9.8" stroke="#FFF6E6" stroke-width="1.8"/></g><path d="M18.6 37.6q-4.6 4.6-1 9.6 3.6.4 6-2.6M45.4 37.6q4.6 4.6 1 9.6-3.6.4-6-2.6" fill="#46536A" stroke="#2E241C" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M24.4 56.4l-1.6 2h4l-.4 1.2h4.2l-.6-3.2M39.6 56.4l1.6 2h-4l.4 1.2h-4.2l.6-3.2" fill="#FF9E3D" stroke="#2E241C" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/><g><circle cx="28" cy="28.6" r="1.6" fill="#2E241C"/><circle cx="36" cy="28.6" r="1.6" fill="#2E241C"/><path d="M26.2 26.2l3.4.8M37.8 26.2l-3.4.8" stroke="#2E241C" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/></g><ellipse cx="25.6" cy="32" rx="2.3" ry="1.3" fill="#F49A93" opacity="0.75"/><ellipse cx="38.4" cy="32" rx="2.3" ry="1.3" fill="#F49A93" opacity="0.75"/></svg></g></svg>

<!-- 손으로 그린 동그라미. d는 그려지는 순서(지연) -->
<svg th:fragment="scribble(d)" class="scribble" th:style="'--d:' + ${d}" viewBox="0 0 100 70" preserveAspectRatio="none" aria-hidden="true">
  <path pathLength="1" d="M14 38 C 10 18, 44 8, 70 13 C 92 17, 94 46, 68 56 C 44 64, 10 58, 13 36 C 15 26, 30 19, 44 18"/>
</svg>

<!-- 손으로 그은 밑줄 -->
<svg th:fragment="underline" class="scribble underline" viewBox="0 0 100 12" preserveAspectRatio="none" aria-hidden="true">
  <path pathLength="1" d="M2 8 C 22 3, 46 11, 70 6 S 92 4, 98 7"/>
</svg>

<div th:fragment="flash" class="narrow">
  <div class="flash notice" th:if="${notice}" role="status">
    <span class="hand">좋아요</span><span th:text="${notice}">알림</span>
  </div>
  <div class="flash error" th:if="${error}" role="alert">
    <span class="hand">잠깐만요</span><span th:text="${error}">오류</span>
  </div>
</div>

<footer class="site-footer" th:fragment="footer">
  <div class="wrap">
    <span class="footer-mark" th:insert="~{fragments/layout :: mark}"></span>
    <span>책 덕후들의 독후감을 한 권으로</span>
    <a class="footer-link" th:href="@{/characters}">책 동물들</a>
  </div>
</footer>

</body>
</html>
