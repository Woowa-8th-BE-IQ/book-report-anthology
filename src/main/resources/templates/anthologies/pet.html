<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <title>덕후감 펫</title>
  <!-- 펫 화면 밝기: 자동(컴퓨터 따라감)·밝게·어둡게. 펫 창 안에만 저장된다 -->
  <script>try{var t=localStorage.getItem('pet-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sun-typeface/suit@2/fonts/variable/woff2/SUIT-Variable.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" th:href="@{/css/pet.css}">
  <script th:src="@{/js/ambience.js}" defer></script>
  <script th:src="@{/js/pet.js}" defer></script>
  <script th:src="@{/js/mention.js}" defer></script>
  <script th:src="@{/js/typing-sound.js}" defer></script>
</head>
<body class="pet-body">
<!-- 캐릭터 조각: 꾸미기에서 서버에 묻지 않고 바로 그린다(Avatar.parts) -->
<script th:inline="javascript">window.AVATAR_PARTS = /*[[${avatarParts}]]*/ null;</script>
  <!-- 선 아이콘 (24×24, 둥근 선, 색은 currentColor) -->
  <svg class="icon-sprite" aria-hidden="true" style="display:none">
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5H10l-4.2 3.2a.5.5 0 0 1-.8-.4V17H5a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 5 5.5z"/><path d="M8 10.5h8M8 13.5h5"/></symbol>
    <symbol id="i-brush" viewBox="0 0 24 24"><path d="M14.5 4.5l5 5-7.8 7.8-5-5z"/><path d="M6.7 12.3c-2.2.3-3 2-3 3.7 0 1.6-.7 2.6-1.2 3 2.6.6 6.2.2 7.7-1.7.9-1.1.8-2.4.2-3.3"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5h10.5a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2z"/><path d="M5 17.5a2 2 0 0 1 2-2h10.5M13 4.5v6l1.8-1.4 1.7 1.4v-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/></symbol>
    <symbol id="i-leave" viewBox="0 0 24 24"><path d="M13.5 4.5H7a1.5 1.5 0 0 0-1.5 1.5v12A1.5 1.5 0 0 0 7 19.5h6.5"/><path d="M11 12h9M17 9l3 3-3 3"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5v8"/><path d="M7.2 6.6a7.5 7.5 0 1 0 9.6 0"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r=".9" fill="currentColor"/><circle cx="15" cy="15" r=".9" fill="currentColor"/><circle cx="15" cy="9" r=".9" fill="currentColor"/><circle cx="9" cy="15" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 7.5L4.5 11 8 14.5"/><path d="M4.5 11H14a5 5 0 0 1 0 10h-2"/></symbol>
    <symbol id="i-update" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4.5V9h-4.5"/><path d="M12 9v4l2.5 1.5"/></symbol>
    <symbol id="i-plus-bare" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.2"/><path d="M15.5 8.5V6.2a1.7 1.7 0 0 0-1.7-1.7H6.2a1.7 1.7 0 0 0-1.7 1.7v7.6a1.7 1.7 0 0 0 1.7 1.7h2.3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-keys" viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="11" rx="2"/><path d="M7 10h.01M10.3 10h.01M13.7 10h.01M17 10h.01M7.5 13.8h9"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4.5 15v-3a7.5 7.5 0 0 1 15 0v3"/><rect x="3.5" y="14" width="4.5" height="6.5" rx="1.6"/><rect x="16" y="14" width="4.5" height="6.5" rx="1.6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5.5" width="3.8" height="13" rx="1" fill="currentColor"/><rect x="13.7" y="5.5" width="3.8" height="13" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 14.5a4.5 4.5 0 0 1 .4-9 5.5 5.5 0 0 1 10.3 1.6A3.7 3.7 0 0 1 17 14.5z"/><path d="M8.5 17.5l-1 2.5M12.5 17.5l-1 2.5M16.5 17.5l-1 2.5"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 9c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 4.3-2 5 -.6"/><path d="M3 14c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 4.3-2 5-.6"/><path d="M3 19c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 4.3-2 5-.6"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/><path d="M16.5 4.5v2.5M15.2 5.8h2.6"/></symbol>
    <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3.5 9h11a2.8 2.8 0 1 0-2.8-2.8"/><path d="M3.5 13.5h15a2.8 2.8 0 1 1-2.8 2.8"/><path d="M3.5 18h7"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.5c3.5 4.4 5.5 7.5 5.5 10a5.5 5.5 0 0 1-11 0c0-2.5 2-5.6 5.5-10z"/><path d="M9.5 14.5a2.6 2.6 0 0 0 2.5 2.5"/></symbol>
    <symbol id="i-city" viewBox="0 0 24 24"><path d="M3.5 20.5h17M5 20.5V10h5v10.5M10 20.5V5h6v15.5M16 20.5v-7h3.5v7"/><path d="M12.3 8.5h1.4M12.3 12h1.4M7 13h1"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5z"/><path d="M13.5 6.5l4 4"/></symbol>
    <symbol id="i-noise" viewBox="0 0 24 24"><path d="M3 12h2l1.5-4 2 8 2-11 2 14 2-9 2 5 1.5-3H21"/></symbol>
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M7 4.5h10v15l-5-3.6-5 3.6z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 20.5V4.5"/><path d="M6 5h11l-2.5 4L17 13H6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 15.5H3z"/><path d="M12 10v4"/><circle cx="12" cy="16.8" r=".6" fill="currentColor"/></symbol>
  </svg>

<!-- 연결된 문집이 없을 때 -->
<div class="pet-stage" th:if="${tabs.isEmpty()}">
  <div class="pet-problem" data-interactive>
    <p>연결된 문집이 없어요.</p>
    <a class="pet-problem-link" th:href="@{/anthologies/new}" target="_blank" rel="noopener">새 문집 열기 ↗</a>
    <button type="button" data-pet="relink">개인 링크 붙여 넣기</button>
  </div>
</div>

<div class="pet-stage" id="pet-stage" th:unless="${tabs.isEmpty()}"
     th:attr="data-selected=${selected}, data-avatar-base=@{/avatars/v3/}, data-build=${build}">

  <!-- 펼친 창: 문집 탭 + 대화 / 캐릭터 바꾸기 -->
  <section class="pet-panel" id="pet-panel" hidden data-interactive aria-label="모임방 대화">
    <header class="pet-head">
      <nav class="pet-tabs" role="tablist" aria-label="문집">
        <button type="button" class="pet-tab" role="tab" th:each="tab : ${tabs}"
                th:attr="data-tab=${tab.code()}, aria-selected=${tab.code() == selected}">
          <span class="pet-tab-title" th:text="${tab.title()}">문집</span>
          <span class="pet-tab-badge" hidden>0</span>
        </button>
      </nav>
      <button type="button" class="pet-plus pet-music" data-pet="sound" aria-label="배경음" title="배경음"><svg class="i"><use href="#i-headphones"/></svg></button>
      <button type="button" class="pet-plus" data-pet="create" aria-label="문집 열기·참여" title="문집 열기·참여"><svg class="i"><use href="#i-plus-bare"/></svg></button>
      <button type="button" class="pet-close" data-pet="collapse" aria-label="접기">✕</button>
    </header>

    <div class="pet-view" th:each="tab : ${tabs}" th:with="room=${tab.room()}"
         th:hidden="${tab.code() != selected}"
         th:attr="data-view=${tab.code()}, data-title=${tab.title()},
                  data-stream=@{/anthologies/{code}/room/stream(code=${tab.code()})},
                  data-say=@{/anthologies/{code}/room/messages(code=${tab.code()})},
                  data-avatar=@{/anthologies/{code}/avatar(code=${tab.code()})},
                  data-read=@{/anthologies/{code}/room/read(code=${tab.code()})},
                  data-bookmark=@{/anthologies/{code}/room/messages/(code=${tab.code()})},
                  data-bookmarks=@{/anthologies/{code}/room/bookmarks(code=${tab.code()})},
                  data-more=${tab.lines().size() >= history},
                  data-unread=${room.unread()}, data-called=${room.calledWhileAway()},
                  data-me=${room.meId()}, data-style=${tab.meStyle()}, data-original=${tab.originalStyle()}">
      <div class="pet-sub">
        <small><span class="pet-online" th:text="${room.onlineCount()}">1</span>명 있어요</small>
        <button type="button" class="pet-sound" data-typing-sound-toggle aria-pressed="false" hidden aria-label="타자 소리"><svg class="i"><use href="#i-keys"/></svg></button>
        <a class="pet-open" th:href="@{/anthologies/{code}/room(code=${tab.code()})}" target="_blank" rel="noopener">방 열기 ↗</a>
      </div>
      <ol class="pet-log">
        <li class="pet-more" hidden><button type="button" data-older>이전 대화 더 보기</button></li>
        <li class="pet-line" th:each="line : ${tab.lines()}"
            th:classappend="${(line.mine(room.meId()) ? 'mine ' : '') + (line.callsMe() ? 'calls-me' : '')}"
            th:attr="data-id=${line.id()}">
          <b th:text="${line.author().nickname()}">감자</b>
          <span th:text="${line.body()}">말</span>
          <button type="button" class="pet-mark" th:classappend="${(line.marked() ? 'on ' : '') + (line.marks() > 0 ? 'has' : '')}"
                  th:attr="aria-pressed=${line.marked()}, data-mark=${line.id()}" title="책갈피"><svg class="i"><use href="#i-mark"/></svg><em th:text="${line.marks() > 0} ? ${line.marks()} : ''"></em></button>
        </li>
      </ol>
      <form class="pet-form" autocomplete="off" data-typing-sound>
        <textarea name="body" rows="1" placeholder="한마디 · @이름으로 부르기" th:attr="maxlength=${bodyMax}" aria-label="한마디"
                  data-mention="template[data-face][data-me='false']" data-mention-scope=".pet-view"></textarea>
        <button type="submit">보내기</button>
      </form>
      <p class="pet-status" role="status"></p>
      <template th:each="member : ${room.members()}"
                th:attr="data-face=${member.id()}, data-name=${member.nickname()}, data-me=${member.me()}">
        <span class="mini" th:utext="${member.avatar()}"></span>
      </template>
    </div>


    <!-- 문집 열기·참여 (펫 안에서) -->
    <section class="pet-create" id="pet-create" hidden aria-label="문집 열기·참여">
      <div class="create-modes" role="tablist">
        <button type="button" role="tab" data-mode="open" aria-selected="true">새 문집 열기</button>
        <button type="button" role="tab" data-mode="join" aria-selected="false">초대받았어요</button>
      </div>
      <form class="create-form" data-form="open" autocomplete="off">
        <label>문집 이름<input name="title" required maxlength="40" placeholder="예: 스무 살의 숲"></label>
        <div class="row">
          <label>책 제목<input name="bookTitle" required maxlength="80" placeholder="예: 노르웨이의 숲"></label>
          <label>지은이<input name="bookAuthor" maxlength="40" placeholder="예: 무라카미 하루키"></label>
        </div>
        <div class="row">
          <label>내 닉네임<input name="nickname" required maxlength="12" placeholder="예: 아이큐"></label>
          <label><span>마감일 <small>· 선택</small></span><input name="dueDate" type="text" inputmode="decimal" placeholder="예: 11.30"></label>
        </div>
        <button type="submit" class="create-go">문집 열기</button>
      </form>
      <form class="create-form" data-form="join" autocomplete="off" hidden>
        <label>받은 초대 링크<input name="invite" required placeholder="https://…/anthologies/…"></label>
        <label>내 닉네임<input name="nickname" required maxlength="12" placeholder="문집에서 쓸 이름"></label>
        <button type="submit" class="create-go">참여하기</button>
        <button type="button" class="create-link" data-pet="relink">개인 링크가 있어요</button>
      </form>
      <div class="create-done" hidden>
        <div class="done-badge"><svg class="i"><use href="#i-check"/></svg></div>
        <b class="done-title"></b>
        <p class="done-text">초대 링크를 보내면 함께 쓸 수 있어요. 카톡방에 붙이면 초대 카드로 보여요.</p>
        <div class="done-copy">
          <input class="done-url" readonly aria-label="초대 링크">
          <button type="button" class="done-copy-btn"><svg class="i"><use href="#i-copy"/></svg><span>복사</span></button>
        </div>
        <button type="button" class="create-go done-go">이 문집으로 가기</button>
      </div>
      <p class="pet-status create-status" role="status"></p>
    </section>

    <!-- 캐릭터 바꾸기 (지금 탭의 문집에서의 내 캐릭터) -->
    <!-- 배경음: 여러 소리를 겹쳐 틀고 소리마다 음량을 정한다(ambience.js) -->
    <section class="pet-sounds" id="pet-sounds" hidden aria-label="배경음">
      <div class="sound-top">
        <button type="button" class="sound-play" data-sound="play" aria-label="재생"><svg class="i play"><use href="#i-play"/></svg><svg class="i pause"><use href="#i-pause"/></svg></button>
        <div class="sound-now">
          <b>배경음</b>
          <small class="sound-status">들을 소리를 골라 보세요</small>
        </div>
        <label class="sound-master" title="전체 음량"><svg class="i"><use href="#i-headphones"/></svg><input type="range" min="0" max="1" step="0.01" data-sound="master" aria-label="전체 음량"></label>
      </div>
      <div class="sound-scenes" role="group" aria-label="장면"></div>
      <div class="sound-grid" role="group" aria-label="소리"></div>
      <div class="sound-foot">
        <button type="button" class="ghost" data-sound="clear">모두 끄기</button>
        <small>녹음은 Freesound CC0, 피아노·소음은 직접 합성</small>
      </div>
    </section>

    <section class="pet-dresser" id="pet-dresser" hidden aria-label="캐릭터 바꾸기">
      <div class="dress-top">
        <img class="dress-preview" alt="" width="84" height="84">
        <div>
          <b>내 캐릭터</b>
          <small class="dress-where"></small>
          <div class="dress-actions">
            <button type="button" data-dress="random"><svg class="i"><use href="#i-dice"/></svg><span>뽑기</span></button>
            <button type="button" data-dress="original"><svg class="i"><use href="#i-undo"/></svg><span>원래대로</span></button>
          </div>
        </div>
      </div>
      <div class="dress-parts">
        <div class="dress-part" th:each="part : ${parts}" th:attr="data-part=${part.key()}">
          <span class="dress-label" th:text="${part.label()}">색</span>
          <div class="dress-options">
            <button type="button" class="dress-option" th:each="option : ${part.options()}"
                    th:attr="data-value=${option.value()}, title=${option.name()}, aria-label=${part.label()} + ' ' + ${option.name()}">
              <img alt="" width="34" height="34" loading="lazy">
            </button>
          </div>
        </div>
      </div>
      <div class="dress-foot">
        <button type="button" class="ghost" data-dress="cancel">그만두기</button>
        <button type="button" data-dress="save">이걸로 할게요</button>
      </div>
      <p class="pet-status dress-status" role="status"></p>
    </section>
  </section>

  <!-- 우클릭 메뉴 -->
  <div class="pet-menu" id="pet-menu" hidden data-interactive role="menu">
    <!-- 문집이 곧 대화창이다: 누르면 그 문집의 대화창이 열린다 -->
    <div class="pet-menu-group">
      <button type="button" role="menuitem" th:each="tab : ${tabs}"
              th:attr="data-menu='focus', data-code=${tab.code()}">
        <svg class="i"><use href="#i-chat"/></svg><span class="pet-menu-title" th:text="${tab.title()}">문집</span><em class="pet-menu-badge" hidden>0</em>
      </button>
    </div>
    <hr>
    <button type="button" role="menuitem" data-menu="add"><svg class="i"><use href="#i-plus"/></svg><span>문집 열기·참여…</span></button>
    <button type="button" role="menuitem" data-menu="leave"><svg class="i"><use href="#i-leave"/></svg><span class="leave-label">이 문집 펫에서 빼기</span></button>
    <hr>
    <button type="button" role="menuitem" data-menu="dress"><svg class="i"><use href="#i-brush"/></svg><span>캐릭터 바꾸기</span></button>
    <button type="button" role="menuitem" data-menu="sound"><svg class="i"><use href="#i-headphones"/></svg><span>배경음</span></button>
    <button type="button" role="menuitem" data-menu="bookmarks"><svg class="i"><use href="#i-mark"/></svg><span>책갈피 모음</span></button>
    <button type="button" role="menuitem" data-menu="theme"><svg class="i"><use href="#i-theme"/></svg><span>화면 밝기 · <b class="theme-label">자동</b></span></button>
    <hr>
    <button type="button" role="menuitem" data-menu="quit" class="quiet"><svg class="i"><use href="#i-power"/></svg><span>펫 끄기</span></button>
  </div>

  <!-- 말풍선 -->
  <div class="pet-bubbles" id="pet-bubbles" aria-live="polite"></div>

  <!-- 내 아바타 -->
  <button type="button" class="pet-avatar" id="pet-avatar" data-interactive
          aria-label="내 펫. 누르면 대화창, 우클릭하면 메뉴가 열려요">
    <span class="pet-face"></span>
    <span class="pet-badge" id="pet-badge" hidden>0</span>
    <span class="pet-listening" aria-hidden="true"><svg class="i"><use href="#i-note"/></svg></span>
  </button>
</div>
</body>
</html>
