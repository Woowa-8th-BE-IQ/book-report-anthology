<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('내 캐릭터')}"></head>
<body class="avatar-page" th:with="a=${dressing.anthology()}, me=${dressing.me()}">
<header th:replace="~{fragments/layout :: header}"></header>

<section class="page-hero narrow" style="padding-bottom:8px">
  <a class="kicker" th:href="${back == 'room'} ? @{/anthologies/{code}/room(code=${a.code()})} : @{/anthologies/{code}(code=${a.code()})}"
     th:text="'← ' + (${back == 'room'} ? '모임방' : ${a.title()})">← 문집</a>
  <h1 data-reveal>내 캐릭터</h1>
  <p class="lead">덕후감 서재의 책 동물 중 하나를 골라요<br>바꾸면 모임방과 바탕화면 펫에 바로 보여요</p>
</section>

<div th:replace="~{fragments/layout :: flash}"></div>

<main class="section" style="padding-top:20px">
  <form class="dresser" id="dresser" method="post" th:action="@{/anthologies/{code}/avatar(code=${a.code()})}" data-once>
    <input type="hidden" name="back" th:value="${back}">

    <div class="dresser-preview paper tape">
      <div class="dresser-stage">
        <img id="dresser-image" th:src="@{/avatars/v4/{s}.svg(s=${dressing.current().slug()})}" alt="" width="180" height="180">
      </div>
      <p class="dresser-name" id="dresser-name" th:text="${dressing.current().title()}">뒤뚱</p>
      <p class="dresser-tagline" id="dresser-tagline" th:text="'“' + ${dressing.current().tagline()} + '”'">“다 엮었어요!”</p>
      <p class="dresser-who" th:text="${me.nickname()}">감자</p>
    </div>

    <div class="dresser-parts">
      <div class="critter-picks" role="radiogroup" aria-label="책 동물">
        <label class="critter-pick" th:each="c : ${critters}"
               th:attr="data-name=${c.title()}, data-tagline=${c.tagline()}">
          <input type="radio" name="critter" th:value="${c.slug()}" th:checked="${c == dressing.current()}">
          <img th:src="@{/avatars/v4/{s}.svg(s=${c.slug()})}" alt="" width="72" height="72" loading="lazy">
          <b th:text="${c.title()}">뒤뚱</b>
          <small th:text="${c.species()}">바위뛰기펭귄</small>
          <em class="critter-first" th:if="${c == dressing.original()}">처음 받은 친구</em>
        </label>
      </div>
      <p class="tool-note">어떤 친구들인지는 <a class="text-link" th:href="@{/characters}" target="_blank" rel="noopener">책 동물 소개</a>에서 볼 수 있어요</p>
      <button class="btn" type="submit">이 친구로 할게요</button>
    </div>
  </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
