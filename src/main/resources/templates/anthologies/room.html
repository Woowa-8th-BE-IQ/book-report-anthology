<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${room.anthology().title()} + ' 모임방')}"></head>
<body class="room-page" th:with="a=${room.anthology()}">
<header th:replace="~{fragments/layout :: header}"></header>

<section class="page-hero narrow" style="padding-bottom:8px">
  <a class="kicker" th:href="@{/anthologies/{code}(code=${a.code()})}" th:text="'← ' + ${a.title()}">← 문집</a>
  <h1 data-reveal>모임방</h1>
  <p class="lead">같은 책을 읽은 사람들이 둘러앉는 곳이에요. 불이 켜진 얼굴이 지금 들어와 있는 사람이에요.</p>
  <a class="room-dress" th:href="@{/anthologies/{code}/avatar(code=${room.anthology().code()}, back='room')}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5l5 5-7.8 7.8-5-5z"/><path d="M6.7 12.3c-2.2.3-3 2-3 3.7 0 1.6-.7 2.6-1.2 3 2.6.6 6.2.2 7.7-1.7.9-1.1.8-2.4.2-3.3"/></svg> 내 캐릭터 꾸미기</a>
  <details class="pet-link">
    <summary><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="11.5" rx="1.8"/><path d="M9 20h6M12 16v4"/><circle cx="12" cy="10.2" r="2.4"/></svg> 바탕화면 펫에 연결하기</summary>
    <div th:replace="~{fragments/pet :: box(${personalUrl})}"></div>
  </details>
</section>

<main class="section room" style="padding-top:20px"
      th:attr="data-stream=@{/anthologies/{code}/room/stream(code=${a.code()})},
               data-say=@{/anthologies/{code}/room/messages(code=${a.code()})},
               data-typing=@{/anthologies/{code}/room/typing(code=${a.code()})},
               data-position=@{/anthologies/{code}/room/position(code=${a.code()})},
               data-read=@{/anthologies/{code}/room/read(code=${a.code()})},
               data-me=${room.meId()}, data-build=${build}">

  <!-- 책상: 참여자가 둘러앉는다 -->
  <section class="table-scene" aria-label="모임방에 있는 사람"
           th:classappend="${room.members().size() > 14} ? 'crowd' : ''">
    <div class="table-top" aria-hidden="true">
      <span class="table-book"></span>
      <span class="table-cup"></span>
      <p class="hand table-count"><span id="online-count" th:text="${room.onlineCount()}">1</span>명 있어요</p>
    </div>
    <ul class="ring floor" id="floor" tabindex="0"
        aria-label="방 바닥. 누르거나 방향키로 내 아바타를 옮겨요">
      <li class="member" th:each="member, stat : ${room.members()}"
          th:classappend="${(member.online() ? 'online ' : '') + (member.me() ? 'me' : '')}"
          th:style="'--x:' + ${member.x()} + ';--y:' + ${member.y()} + ';--d:' + ${stat.index % 7}"
          th:attr="data-member=${member.id()}, data-name=${member.nickname()},
                   data-seat-x=${member.seatX()}, data-seat-y=${member.seatY()}">
        <span class="bubble" hidden></span>
        <span class="avatar" th:utext="${member.avatar()}"></span>
        <span class="member-name">
          <span th:text="${member.nickname()}">감자</span>
          <small th:if="${member.editor()}">엮은이</small>
          <small class="seen" th:unless="${member.me()}" th:hidden="${member.online()}"
                 th:text="${member.lastSeen()}" title="마지막 접속">30분 전</small>
        </span>
        <span class="visually-hidden presence-label" th:text="${member.online()} ? '들어와 있음' : '자리 비움'">상태</span>
      </li>
    </ul>
    <p class="floor-hint hand">바닥을 누르면 내 아바타가 걸어가요 · 방향키도 돼요</p>
  </section>

  <!-- 이야기 -->
  <section class="paper talk-panel" aria-label="이야기">
    <p class="room-note" th:if="${room.notSubmittedCount() > 0}">
      아직 독후감을 내지 않은 사람이 <b th:text="${room.notSubmittedCount()}">2</b>명 있어요. 남의 글 내용은 조금만 아껴 주세요.
    </p>
    <ol class="talk" id="talk" aria-live="polite">
      <li class="talk-empty" th:if="${room.lines().isEmpty()}">아직 조용해요. 첫마디를 건네 보세요.</li>
      <th:block th:each="line : ${room.lines()}">
        <li class="talk-day" th:if="${line.day() != null}"><span th:text="${line.day()}">10월 21일</span></li>
        <li class="talk-line" th:classappend="${(line.mine(room.meId()) ? 'mine ' : '') + (line.callsMe() ? 'calls-me' : '')}"
            th:attr="data-id=${line.id()}, data-author=${line.author().id()}">
          <span class="avatar small" aria-hidden="true" th:utext="${line.author().avatar()}"></span>
          <div class="talk-body">
            <span class="talk-who"><b th:text="${line.author().nickname()}">감자</b> <time th:text="${line.at()}">11:20</time></span>
            <p th:text="${line.body()}">말</p>
          </div>
        </li>
      </th:block>
      <li id="talk-end" aria-hidden="true"></li>
    </ol>
    <p class="typing-line" id="typing-line" aria-live="polite"></p>
    <form class="talk-form" id="talk-form" data-typing-sound method="post"
          th:action="@{/anthologies/{code}/room/messages(code=${a.code()})}">
      <label class="visually-hidden" for="talk-input">말</label>
      <textarea id="talk-input" name="body" rows="1" required th:attr="maxlength=${bodyMax}"
                placeholder="한마디 건네기 · @이름으로 부르기" title="Enter로 보내고, Shift+Enter로 줄을 바꿔요. @를 치면 부를 사람을 골라요"
                data-mention=".member:not(.me)"></textarea>
      <button class="btn" type="submit">보내기</button>
    </form>
    <div class="talk-foot">
      <p class="talk-status" id="talk-status" role="status"></p>
      <button type="button" class="sound-toggle" data-typing-sound-toggle aria-pressed="false" hidden>
        <span aria-hidden="true">⌨</span> <span class="label">타자 소리 꺼짐</span>
      </button>
    </div>
  </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/mention.js}" defer></script>
</body>
</html>
