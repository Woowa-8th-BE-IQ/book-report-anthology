<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${view.anthology().title()} + ' 원고')}"></head>
<body class="has-cta" th:with="a=${view.anthology()}">
<header th:replace="~{fragments/layout :: header}"></header>

<section class="page-hero narrow">
  <a class="kicker" th:href="@{/anthologies/{code}(code=${a.code()})}" th:text="'← ' + ${a.title()}">← 문집</a>
  <h1 data-reveal>원고 미리보기</h1>
  <p class="lead">이 순서로 책에 실려요. 내 글 중 빼고 싶은 게 있으면 지금 고르세요. 다른 사람의 글은 그 사람만 뺄 수 있어요.</p>
</section>

<div th:replace="~{fragments/layout :: flash}"></div>
<div class="narrow" th:if="${manuscriptProblem}">
  <div class="flash error" role="alert"><span class="hand">비어 있어요</span><span th:text="${manuscriptProblem}">문제</span></div>
</div>

<main class="section" style="padding-top:40px">
  <div class="narrow book-spread">
    <div class="book-page title fade-up">
      <span class="kicker">독후감 문집</span>
      <h1 th:text="${a.title()}">제목</h1>
      <p th:text="${a.readLine()}">원서</p>
      <p class="hand" style="font-size:24px;margin-top:40px"
         th:text="${manuscript != null} ? ${manuscript.pieces().size()} + '명이 쓴 독후감' : ''">N명</p>
    </div>

    <div class="book-page fade-up" th:if="${a.introduction() != null}">
      <span class="kicker">도서 소개</span>
      <p style="white-space:pre-line;margin-top:18px" th:text="${a.introduction()}">소개</p>
    </div>

    <div class="book-page fade-up" id="toc">
      <span class="kicker">차례</span>
      <ol class="toc">
        <li th:each="card : ${view.cards()}" th:classappend="${card.included()} ? '' : 'excluded'">
          <span class="toc-byline" th:text="${card.byline()}">감자(김주하)</span>
          <span class="toc-dots"></span>
          <a class="toc-title" th:href="@{/anthologies/{code}/essays/{id}(code=${a.code()}, id=${card.essayId()})}"
             th:text="${card.title()}" style="color:inherit;text-decoration:none">제목</a>
        </li>
      </ol>
      <p class="toc-foot">흐린 글은 쓴 사람이 책에서 뺀 글이에요.</p>
    </div>

    <div class="paper tape my-essay" th:each="card : ${view.cards()}" th:if="${card.mine()}">
      <div class="what">
        <span class="hand" th:text="${card.included()} ? '책에 들어가요' : '책에서 뺐어요'">상태</span>
        <h2 th:text="${card.title()}">내 글</h2>
        <p>마음이 바뀌면 언제든 다시 바꿀 수 있어요.</p>
      </div>
      <form method="post" th:action="@{/anthologies/{code}/essays/{id}/inclusion(code=${a.code()}, id=${card.essayId()})}">
        <input type="hidden" name="included" th:value="${!card.included()}">
        <button class="btn ghost" type="submit" th:text="${card.included()} ? '책에서 빼기' : '다시 넣기'">토글</button>
      </form>
    </div>

    <div class="paper" style="padding:24px">
      <h3 style="margin:0 0 6px;font-size:15px">공개 소개 페이지</h3>
      <p style="margin:0 0 12px;font-size:14px;color:var(--ink-soft)">도서 소개와 차례만 보이는 페이지예요. 본문은 보이지 않아요. "남이 뭐라고 썼는지" 궁금하게 만드는 입구예요.</p>
      <div class="copy-line">
        <input id="about-url" type="text" th:value="${aboutUrl}" readonly aria-label="공개 소개 페이지 링크">
        <button class="btn small ghost" type="button" data-copy="about-url">복사</button>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<div class="cta-bar">
  <a class="btn" th:if="${manuscript != null}" th:href="@{/anthologies/{code}/book.epub(code=${a.code()})}">EPUB 내려받기</a>
  <button class="btn" th:if="${manuscript == null}" type="button" disabled>책에 넣을 글을 골라 주세요</button>
</div>
</body>
</html>
