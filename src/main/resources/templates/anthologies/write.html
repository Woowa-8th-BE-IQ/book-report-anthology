<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('독후감 쓰기')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<section class="page-hero narrow" style="padding-bottom:0">
  <a class="kicker" th:href="@{/anthologies/{code}(code=${anthology.code()})}" th:text="'← ' + ${anthology.title()}">← 문집</a>
  <div class="book" style="margin-top:10px" th:text="${anthology.readLine()}">『책』을 읽고</div>
</section>

<div th:replace="~{fragments/layout :: flash}"></div>

<main class="section" style="padding-top:28px">
  <div class="narrow">
    <!-- 엮은이의 글감 질문 -->
    <aside class="paper prompts-card" th:if="${!anthology.prompts().isEmpty()}">
      <span class="hand">엮은이가 던진 질문</span>
      <ol class="prompt-list"><li th:each="prompt : ${anthology.prompts()}" th:text="${prompt}">질문</li></ol>
      <p class="tool-note">꼭 답하지 않아도 돼요. 시작이 막힐 때 붙잡아 보세요.</p>
    </aside>

    <!-- 이 기기에만 남은 글이 있을 때 -->
    <div class="paper restore-banner" id="restore" hidden role="alert">
      <span class="hand">이 기기에 저장 안 된 글이 있어요</span>
      <p>서버에 저장되기 전에 창이 닫혔던 것 같아요. 그때 쓰던 글을 불러올까요?</p>
      <div class="row">
        <button class="btn small" type="button" data-restore="apply">불러오기</button>
        <button class="btn small ghost" type="button" data-restore="discard">버리기</button>
      </div>
    </div>

    <form class="paper tape editor" id="essay-form" data-typing-sound method="post"
          th:action="@{/anthologies/{code}/essay(code=${anthology.code()})}"
          th:object="${essayForm}" data-once data-guard
          th:attr="data-autosave=@{/anthologies/{code}/essay/autosave(code=${anthology.code()})},
                   data-draft-key='ab-draft-' + ${anthology.code()},
                   data-saved-at=${savedAtMillis},
                   data-submitted=${essay != null and essay.isSubmitted()},
                   data-byline=${me.byline()},
                   data-citation=${anthology.citation()},
                   data-body-min=${limits.bodyMin()}">
      <div class="editor-top">
        <p class="card-byline" style="margin:0;font-size:13px;color:var(--muted)" th:text="${me.byline()}">닉네임(실명)</p>
        <button type="button" class="sound-toggle" id="typing-sound" data-typing-sound-toggle aria-pressed="false" hidden
                title="키를 누를 때 타자 소리를 내요">
          <span aria-hidden="true">⌨</span> <span class="label">타자 소리 꺼짐</span>
        </button>
      </div>

      <div class="field">
        <label for="title" class="visually-hidden">제목</label>
        <input id="title" class="title-input" type="text" th:field="*{title}" th:attr="maxlength=${limits.titleMax()}"
               placeholder="제목" autocomplete="off">
      </div>

      <div class="field">
        <label for="quote">마음에 남은 문장 <span class="hint">· 선택, 하나만</span></label>
        <textarea id="quote" class="quote-input" th:field="*{quote}" rows="2"
                  data-count="quote-count" th:attr="data-max=${limits.quoteMax()}"
                  placeholder="책에서 옮겨 온 한두 문장"></textarea>
        <span class="counter" id="quote-count"></span>
        <span class="hint">원서 보호를 위해 150자까지만 옮길 수 있어요<br>출처는 자동으로 붙어요</span>
      </div>

      <div class="field" style="margin-bottom:0">
        <label for="body" class="visually-hidden">본문</label>
        <textarea id="body" class="body-input" th:field="*{body}" th:attr="maxlength=${limits.bodyMax()}"
                  placeholder="읽으며 떠오른 것, 내 이야기, 책이 나에게 남긴 것. 빈 줄로 문단을 나눠요."></textarea>
      </div>

      <!-- 200자 문턱 -->
      <div class="threshold" aria-live="polite">
        <div class="threshold-line"><span id="threshold-fill"></span></div>
        <span id="threshold-text" class="hand">제출까지 200자</span>
      </div>

      <div class="save-bar">
        <span class="status" id="save-status" aria-live="polite"
              th:text="${essay == null} ? '쓰는 동안 자동으로 저장돼요' : (${essay.isSubmitted()} ? '제출함 · ' : '초안 · ') + ${#temporals.format(essay.updatedAt(), 'M월 d일 HH:mm')} + ' 저장'">초안</span>
        <span class="spacer"></span>
        <button class="btn ghost" type="submit" name="action" value="save"
                th:text="${essay != null and essay.isSubmitted()} ? '고친 내용 저장' : '지금 저장'">지금 저장</button>
        <button class="btn" type="submit" name="action" value="submit" id="submit-button"
                th:if="${essay == null or !essay.isSubmitted()}">제출하고 남의 글 열기</button>
      </div>
    </form>
    <p style="font-size:13px;color:var(--muted);margin-top:16px">
      본문은 200자 이상이면 제출할 수 있어요. 제출한 뒤에도 마감 전까지는 고칠 수 있어요.
    </p>
  </div>
</main>

<!-- 제출 전 미리보기: 책 한 쪽에 실린 모습 -->
<dialog class="preview-dialog" id="preview" aria-labelledby="preview-title">
  <div class="book-page preview-page">
    <span class="kicker" id="preview-byline"></span>
    <h2 id="preview-title"></h2>
    <figure class="quote" id="preview-quote" hidden>
      <blockquote style="margin:0" id="preview-quote-text"></blockquote>
      <figcaption id="preview-citation"></figcaption>
    </figure>
    <div id="preview-body"></div>
  </div>
  <div class="preview-actions">
    <p class="hand">책에는 이렇게 실려요</p>
    <button class="btn ghost" type="button" data-preview="close">조금 더 고칠게요</button>
    <button class="btn" type="button" data-preview="submit">이대로 제출하기</button>
  </div>
</dialog>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
