<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('문집 열기')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="section">
  <div class="narrow">
    <div class="section-head reveal-on-view">
      <h1 class="section-title" data-reveal>독후감 문집 열기</h1>
      <span class="rule"></span>
      <p class="lead">함께 읽을 책 한 권과 마감일을 정해요. 여는 사람이 <b>엮은이</b>가 되어 도서 소개를 쓰고 마감을 해요.</p>
    </div>

    <form class="paper tape" method="post" th:action="@{/anthologies}" th:object="${form}" data-once>
      <div class="field">
        <label for="title">문집 제목 <span class="hint">· 그대로 책 제목이 돼요</span></label>
        <input id="title" type="text" th:field="*{title}" maxlength="40" required
               placeholder="예: 일단 나부터 읽어 봅니다" data-count="title-count" data-max="40">
        <span class="counter" id="title-count"></span>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="bookTitle">함께 읽을 책</label>
          <input id="bookTitle" type="text" th:field="*{bookTitle}" maxlength="100" required placeholder="리팩터링">
        </div>
        <div class="field">
          <label for="bookAuthor">지은이 <span class="hint">· 선택</span></label>
          <input id="bookAuthor" type="text" th:field="*{bookAuthor}" maxlength="50" placeholder="마틴 파울러">
        </div>
      </div>
      <div class="field">
        <label for="dueDate">마감일 <span class="hint">· 선택, 마감은 엮은이가 직접 눌러요</span></label>
        <input id="dueDate" type="date" th:field="*{dueDate}" th:min="${today}">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="nickname">내 닉네임</label>
          <input id="nickname" type="text" th:field="*{nickname}" maxlength="12" required placeholder="레오">
        </div>
        <div class="field">
          <label for="realName">실명 <span class="hint">· 선택, 책에 "닉네임(실명)"으로 실려요</span></label>
          <input id="realName" type="text" th:field="*{realName}" maxlength="20" placeholder="한동희">
        </div>
      </div>
      <button class="btn" type="submit">문집 열고 초대 링크 받기</button>
    </form>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
