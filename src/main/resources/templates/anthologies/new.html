<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('문집 열기')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="section">
  <div class="narrow">
    <div class="section-head reveal-on-view">
      <h1 class="section-title" data-reveal>독후감 문집 열기</h1>
      <span class="rule"></span>
      <p class="lead">함께 읽을 책을 정해 문집을 열고, 친구들을 초대해 보세요</p>
    </div>

    <form class="paper tape" method="post" th:action="@{/anthologies}" th:object="${form}" data-once>
      <div class="field">
        <label for="title">문집 제목</label>
        <input id="title" type="text" th:field="*{title}" maxlength="40" required
               placeholder="예: 스무 살의 숲" data-count="title-count" data-max="40">
        <span class="counter" id="title-count"></span>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="bookTitle">함께 읽을 책</label>
          <input id="bookTitle" type="text" th:field="*{bookTitle}" maxlength="100" required placeholder="노르웨이의 숲">
        </div>
        <div class="field">
          <label for="bookAuthor">지은이 <span class="hint">· 선택</span></label>
          <input id="bookAuthor" type="text" th:field="*{bookAuthor}" maxlength="50" placeholder="무라카미 하루키">
        </div>
      </div>
      <div class="field">
        <label for="dueDate">마감일 <span class="hint">· 선택</span></label>
        <div class="due-field" data-due th:attr="data-today=${today}">
          <input id="dueDate" type="text" th:field="*{dueDate}" inputmode="decimal" autocomplete="off"
                 placeholder="예: 11.30" aria-describedby="due-read">
          <div class="due-quick" role="group" aria-label="빠르게 고르기">
            <button type="button" data-due-days="7">1주 뒤</button>
            <button type="button" data-due-days="14">2주 뒤</button>
            <button type="button" data-due-days="30">한 달 뒤</button>
          </div>
          <span class="due-read" id="due-read" aria-live="polite"></span>
        </div>
      </div>
      <div class="field">
        <label for="nickname">내 닉네임 <span class="hint">· 책에도 이 이름으로 실려요</span></label>
        <input id="nickname" type="text" th:field="*{nickname}" maxlength="12" required placeholder="아이큐">
      </div>
      <button class="btn btn-wide" type="submit">문집 열고 초대 링크 받기</button>
    </form>
  </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
