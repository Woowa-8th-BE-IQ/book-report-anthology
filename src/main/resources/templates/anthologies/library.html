<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('꼬깃 서고')}"></head>
<body class="library-page" th:with="v=${library}, room=${library.room()}, a=${library.anthology()}">
<!-- 캐릭터 그림의 손그림 흔들림 필터. 숨겨진 그림보다 먼저 와야 한다(Avatar.WOBBLE) -->
<svg class="wobble-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute" th:utext="${wobble}"></svg>
<!-- WebGL이 되면 3D 종이 디오라마, 안 되면(또는 ?flat) 2D 서고 -->
<script>try{var q=location.search.indexOf('flat')>=0,c=document.createElement('canvas');document.documentElement.dataset.lib=!q&&window.WebGL2RenderingContext&&c.getContext('webgl2')?'3d':'2d'}catch(e){document.documentElement.dataset.lib='2d'}</script>
<link rel="stylesheet" th:href="@{/css/library.css}">
<script th:src="@{/js/ambience.js}" data-manual defer></script>
<script th:src="@{/js/library-sound.js}" defer></script>
<script th:src="@{/js/library.js}" defer></script>
<script type="module" th:src="@{/js/library3d.js}"></script>

<main class="lib" id="library"
      th:attr="data-code=${a.code()}, data-me=${room.meId()}, data-build=${build},
               data-stream=@{/anthologies/{c}/room/stream(c=${a.code()}, library=true)},
               data-spot=@{/anthologies/{c}/library/spot(c=${a.code()})},
               data-act=@{/anthologies/{c}/library/act(c=${a.code()})},
               data-say=@{/anthologies/{c}/room/messages(c=${a.code()})},
               data-stars=${v.stars()}">

  <!-- 서고: 바닥·벽·책장 탑은 library.js가 그린다. 사람과 가구는 그 위에 깊이 순서대로 놓인다 -->
  <div class="lib-stage" tabindex="0" aria-label="꼬깃 서고. 바닥을 누르거나 WASD·방향키로 걸어요">
    <div class="lib-world"></div>
  </div>

  <!-- 위: 어디인지, 몇 명 -->
  <header class="lib-top">
    <a class="lib-pill lib-back" th:href="@{/anthologies/{c}/room(c=${a.code()})}" aria-label="모임방으로 돌아가기">←</a>
    <div class="lib-pill lib-where">
      <b>꼬깃 서고</b><span class="dot">·</span><span class="lib-place">큰 서고</span><span class="dot">·</span><span class="lib-title" th:text="${a.title()}">문집</span><span class="dot">·</span><span>지금 <b class="lib-count">1</b>명</span>
    </div>
    <span class="lib-spacer"></span>
    <button type="button" class="lib-pill lib-stars" data-lib="stars" th:title="'이 문집에 꽂힌 책갈피 ' + ${v.stars()} + '개'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.4 5.2 5.6.6-4.2 3.8 1.2 5.5L12 15.8l-5 2.8 1.2-5.5L4 9.3l5.6-.6z"/></svg>
      책갈피 별 <b th:text="${v.stars()}">0</b>
    </button>
  </header>

  <!-- 오른쪽: 지금 서고에 있는 사람 -->
  <aside class="lib-people" aria-label="지금 서고에 있는 사람">
    <button type="button" class="lib-people-toggle" aria-expanded="true">함께 있는 사람</button>
    <ol class="lib-people-list"></ol>
  </aside>

  <!-- 아래: 한마디와 몸짓 -->
  <div class="lib-bottom">
    <p class="lib-hint"><span class="lib-hint-2d">바닥을 누르거나 <kbd>WASD</kbd>로 걸어요 · 의자·방석을 누르면 앉아요</span><span class="lib-hint-3d">바닥을 눌러 걷고, 끌어서 둘러봐요 · <kbd>Shift</kbd> 달리기 · <kbd>Space</kbd> 점프 · 왼쪽 벽 책 엘리베이터로 2층 북카페에 가요</span></p>
    <form class="lib-say" autocomplete="off">
      <input type="text" name="body" th:attr="maxlength=${bodyMax}" placeholder="한마디 띄우기 · Enter" aria-label="한마디">
      <button type="submit">띄우기</button>
    </form>
    <nav class="lib-bar" aria-label="몸짓">
      <label class="lib-status">
        <span class="visually-hidden">지금 하는 일</span>
        <select name="status">
          <option value="read">📖 읽는 중</option>
          <option value="write">✏️ 쓰는 중</option>
          <option value="rest">☕ 쉬는 중</option>
        </select>
      </label>
      <button type="button" data-do="sit"><span>앉기</span><kbd>Z</kbd></button>
      <button type="button" data-do="nap" class="lib-3d-only"><span>낮잠</span><kbd>N</kbd></button>
      <button type="button" data-do="jump" class="lib-3d-only"><span>점프</span><kbd>Space</kbd></button>
      <button type="button" data-do="run" class="lib-3d-only" aria-pressed="false"><span>달리기</span><kbd>Shift</kbd></button>
      <button type="button" data-do="bow"><span>인사</span><kbd>E</kbd></button>
      <button type="button" data-do="stretch"><span>기지개</span><kbd>Q</kbd></button>
      <button type="button" data-do="flip"><span>사락사락</span><kbd>R</kbd></button>
      <button type="button" data-do="music" aria-pressed="false"><span>배경음</span></button>
      <button type="button" data-do="sfx" aria-pressed="false"><span>효과음</span></button>
      <button type="button" data-do="gait" aria-pressed="false"><span>걸음 효과</span></button>
    </nav>
  </div>

  <!-- 3D: 시점 돌리기·당기기, 가리킨 것 이름, 장소를 오갈 때 잠깐 어두워지는 막 -->
  <div class="lib-cam lib-3d-only" aria-label="시점">
    <button type="button" data-cam="left" aria-label="왼쪽으로 돌리기">⟲</button>
    <button type="button" data-cam="in" aria-label="가까이">＋</button>
    <button type="button" data-cam="out" aria-label="멀리">－</button>
    <button type="button" data-cam="right" aria-label="오른쪽으로 돌리기">⟳</button>
  </div>
  <p class="lib-tip" hidden></p>
  <div class="lib-fade" aria-hidden="true"></div>

  <!-- 들어가기 전: 잠시 머물다 가요 -->
  <div class="lib-gate" role="dialog" aria-modal="true" aria-labelledby="lib-gate-title">
    <div class="lib-gate-card">
      <span class="lib-gate-face" th:utext="${room.me().avatar()}"></span>
      <p class="lib-gate-kicker" th:text="${a.title()}">문집</p>
      <h1 id="lib-gate-title">꼬깃 서고</h1>
      <p class="lib-gate-lead">높은 책장 사이를 거닐다<br>마음에 드는 자리에 앉아 쉬어 가요</p>
      <p class="lib-gate-me"><b th:text="${room.me().nickname()}">감자</b>, 어서 와요</p>
      <label class="lib-gate-sound"><input type="checkbox" data-lib="sound" checked> 소리와 함께 들어가기 <small>배경음 · 발소리</small></label>
      <button type="button" class="lib-gate-go" data-lib="enter">들어가기</button>
      <a class="lib-gate-back" th:href="@{/anthologies/{c}/room(c=${a.code()})}">모임방으로 돌아가기</a>
    </div>
  </div>

  <!-- 가구를 눌렀을 때 뜨는 쪽지 -->
  <div class="lib-card" hidden role="dialog" aria-live="polite">
    <button type="button" class="lib-card-close" aria-label="닫기">×</button>
    <div class="lib-card-body"></div>
  </div>
  <p class="lib-toast" role="status" aria-live="polite"></p>

  <!-- 쪽지 내용(가구별) -->
  <template data-card="book">
    <p class="lib-card-kicker">펼친 책 조형물</p>
    <h2 th:text="'『' + ${a.bookTitle()} + '』'">『책』</h2>
    <p class="lib-card-sub" th:text="${a.bookAuthor()}">지은이</p>
    <p>우리 <b th:text="${v.total()}">0</b>명이 이 책을 읽고 있어요 · <b th:text="${v.submitted()}">0</b>편 냈어요</p>
    <p class="lib-card-due" th:if="${v.due() != null}" th:text="${v.due()}">마감 D-3</p>
    <a class="lib-card-link" th:href="@{/anthologies/{c}/write(c=${a.code()})}">내 독후감 쓰러 가기 →</a>
  </template>
  <template data-card="board">
    <p class="lib-card-kicker">게시판</p>
    <h2>글감 질문</h2>
    <ol class="lib-card-prompts" th:unless="${v.prompts().isEmpty()}">
      <li th:each="p : ${v.prompts()}" th:text="${p}">질문</li>
    </ol>
    <p th:if="${v.prompts().isEmpty()}">아직 붙은 질문이 없어요.<br>엮은이가 글감 질문을 붙이면 여기 보여요.</p>
  </template>
  <template data-card="shelf">
    <p class="lib-card-kicker">북 카트</p>
    <h2>우리 책장</h2>
    <p>지금까지 <b th:text="${v.submitted()}">0</b>편이 꽂혔어요.</p>
    <a class="lib-card-link" th:href="${'/anthologies/' + a.code() + '#shelf'}">책장에서 읽기 →</a>
  </template>
  <template data-card="leave">
    <p class="lib-card-kicker">오른쪽 벽 문</p>
    <h2>모임방으로 갈까요?</h2>
    <p>문을 열면 서고에서 나가 모임방 대화로 돌아가요.</p>
    <a class="lib-card-link" th:href="@{/anthologies/{c}/room(c=${a.code()})}">모임방으로 →</a>
  </template>
  <template data-card="stars">
    <p class="lib-card-kicker">천장의 책갈피 별</p>
    <h2>✦ <span th:text="${v.stars()}">0</span>개</h2>
    <p>모임방에서 마음에 드는 말에 책갈피를 꽂으면<br>서고 천장에 별이 하나씩 늘어나요.</p>
    <a class="lib-card-link" th:href="@{/anthologies/{c}/room/bookmarks(c=${a.code()})}">책갈피 모음 보기 →</a>
  </template>

  <!-- 사람: 서고에 들어온 사람만 보인다 -->
  <template th:each="m : ${room.members()}"
            th:attr="data-person=${m.id()}, data-name=${m.nickname()}, data-me=${m.me()}">
    <span class="avatar" th:utext="${m.avatar()}"></span>
  </template>

  <noscript><p class="lib-noscript">꼬깃 서고는 자바스크립트가 켜져 있어야 걸어 다닐 수 있어요.</p></noscript>
</main>
</body>
</html>
